name: Air the weekly Radio Derb rerun

on:
  schedule:
    - cron: "0 3 * * 6"      # Sat 03:00 UTC = Friday 11pm Eastern (10pm in winter)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  rerun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python rerun.py
        env:
          EPISODES_PER_RUN: "1"
      - name: Commit feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml state.json
          git diff --cached --quiet || git commit -m "Air rerun $(date -u +%F)"
          git push
